name: Auto Content Generation & SEO

on:
  schedule:
    # 今天 03:10 UTC 执行（北京时间 11:10），之后每天 02:00 UTC（北京时间 10:00）
    - cron: '10 3 21 5 *'
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      task_type:
        description: 'Task type to run'
        required: true
        default: 'content'
        type: choice
        options:
          - content
          - seo
          - all

env:
  NODE_VERSION: '18'
  GA4_PROPERTY_ID: '14904304787'
  GA4_MEASUREMENT_ID: 'G-QMFH9M0HNR'
  SITE_URL: 'https://exdreamcolors.win'

permissions:
  contents: write

jobs:
  # 任务1: 内容生成
  generate-content:
    if: github.event.inputs.task_type == 'content' || github.event.inputs.task_type == 'all' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Generate daily content
        run: node scripts/generate-content.js

      - name: Commit and push content
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git diff --cached --quiet || (git commit -m "Auto-generate content: $(date +%Y-%m-%d)" && git push)

  # 任务2: SEO优化
  optimize-seo:
    if: github.event.inputs.task_type == 'seo' || github.event.inputs.task_type == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Optimize SEO
        run: node scripts/optimize-seo.js

      - name: Commit SEO changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git diff --cached --quiet || (git commit -m "Auto-optimize SEO: $(date +%Y-%m-%d)" && git push)
